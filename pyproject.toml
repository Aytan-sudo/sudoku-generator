[project]
name = "sudoku-generator"
version = "0.1.0"
description = "Générateur de sudokus avec classificateur de difficulté sur 10 niveaux et rendu PDF A4"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Aymeric Cantais", email = "cantais.aymeric@gmail.com" }]
dependencies = [
    "reportlab>=4.2",
    "typer>=0.15",
]

[project.scripts]
sudoku = "sudoku.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sudoku"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pypdf>=5.1",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["sudoku", "tools"]
# `tools/` n'est pas un paquet installé : sans cette ligne, un script d'outillage
# importé par un test passerait pour une dépendance tierce.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true
# ReportLab ships no type information. The published stubs lag the runtime
# version, and the surface used here is small, so the imports are simply
# untyped rather than checked against a stale contract.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
